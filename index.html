<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nytask! Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .kanban-card { cursor: grab; }
        .kanban-card:active { cursor: grabbing; }
        /* Grid background for Weekly Calendar */
        .time-grid-bg { background-image: linear-gradient(to bottom, #f3f4f6 1px, transparent 1px); background-size: 100% 60px; }
    </style>
</head>
<body class="bg-slate-50 font-sans overflow-hidden text-gray-800">
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center gap-4">
        <i data-lucide="loader-2" class="w-10 h-10 animate-spin text-[#285c54]"></i>
        <p class="font-bold text-gray-500 tracking-wide animate-pulse" id="loading-text">Checking Authentication...</p>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 bg-slate-50 z-[90] hidden flex-col items-center justify-center p-6 text-center">
        <div class="bg-white p-8 lg:p-10 rounded-3xl shadow-xl max-w-md w-full flex flex-col items-center">
            <div class="h-12 lg:h-14 mb-6 flex items-center justify-center">
                <img src="logo.png" alt="nytask!" class="h-full object-contain" onerror="this.onerror=null; this.outerHTML='<span class=\\'font-extrabold text-4xl lg:text-5xl tracking-tight text-[#285c54]\\'>nytask!</span>'">
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Welcome to nytask!</h1>
            <p class="text-sm text-gray-500 mb-8">Sign in to sync your tasks, projects, and agendas across all your devices.</p>
            <button onclick="window.loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-gray-200 text-gray-700 font-bold py-3.5 px-4 rounded-xl hover:bg-gray-50 hover:border-gray-300 transition shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Main App Wrapper -->
    <div id="app" class="hidden flex-col lg:flex-row h-screen w-full relative z-10"></div>
    
    <!-- Modals Wrapper -->
    <div id="modal-root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxhoCNVQFp9gdQ_fxNi7fjq5YcWkhih6I",
            authDomain: "tasktracker-net.firebaseapp.com",
            projectId: "tasktracker-net",
            storageBucket: "tasktracker-net.firebasestorage.app",
            messagingSenderId: "53658095983",
            appId: "1:53658095983:web:04ced390c5c14b96bd189a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const dateObj = new Date();
        const TODAY = dateObj.getFullYear() + '-' + String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
        
        const TAILWIND_COLORS = ['bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-green-500', 'bg-teal-500', 'bg-blue-500', 'bg-indigo-500', 'bg-purple-500', 'bg-pink-500'];
        const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const DAYS_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        const THEMES = [
            { id: 'teal', name: 'Teal', mainBg: 'bg-[#285c54]', mainText: 'text-[#285c54]', mainBorder: 'border-[#285c54]', hoverBg: 'hover:bg-[#1e4740]', lightBg: 'bg-[#eef7f5]', accentText: 'text-[#a7d3cb]' },
            { id: 'blue', name: 'Pacific Blue', mainBg: 'bg-[#0096c7]', mainText: 'text-[#0096c7]', mainBorder: 'border-[#0096c7]', hoverBg: 'hover:bg-[#0077b6]', lightBg: 'bg-[#e0f2fe]', accentText: 'text-[#bae6fd]' },
            { id: 'navy', name: 'Navy', mainBg: 'bg-[#1e3a8a]', mainText: 'text-[#1e3a8a]', mainBorder: 'border-[#1e3a8a]', hoverBg: 'hover:bg-[#172554]', lightBg: 'bg-[#eff6ff]', accentText: 'text-[#bfdbfe]' },
            { id: 'rose', name: 'Rose', mainBg: 'bg-[#be123c]', mainText: 'text-[#be123c]', mainBorder: 'border-[#be123c]', hoverBg: 'hover:bg-[#9f1239]', lightBg: 'bg-[#fff1f2]', accentText: 'text-[#fecdd3]' },
            { id: 'lilac', name: 'Lilac', mainBg: 'bg-[#7e22ce]', mainText: 'text-[#7e22ce]', mainBorder: 'border-[#7e22ce]', hoverBg: 'hover:bg-[#6b21a8]', lightBg: 'bg-[#faf5ff]', accentText: 'text-[#e9d5ff]' },
            { id: 'mint', name: 'Mint Green', mainBg: 'bg-[#059669]', mainText: 'text-[#059669]', mainBorder: 'border-[#059669]', hoverBg: 'hover:bg-[#047857]', lightBg: 'bg-[#ecfdf5]', accentText: 'text-[#a7f3d0]' },
            { id: 'peach', name: 'Peach', mainBg: 'bg-[#ea580c]', mainText: 'text-[#ea580c]', mainBorder: 'border-[#ea580c]', hoverBg: 'hover:bg-[#c2410c]', lightBg: 'bg-[#fff7ed]', accentText: 'text-[#fed7aa]' },
            { id: 'night', name: 'Night', mainBg: 'bg-[#171717]', mainText: 'text-[#171717]', mainBorder: 'border-[#171717]', hoverBg: 'hover:bg-[#262626]', lightBg: 'bg-[#f5f5f5]', accentText: 'text-[#d4d4d4]', isDark: true }
        ];

        const TABS = [
            { id: 'Dashboard', name: 'Dashboard', icon: 'home' },
            { id: 'Details', name: 'Details', icon: 'briefcase' },
            { id: 'Calendar', name: 'Calendar', icon: 'calendar' },
            { id: 'Settings', name: 'Settings', icon: 'settings' }
        ];

        const PRIORITY_SCORES = { 'High': 3, 'Medium': 2, 'Low': 1 };
        
        window.formatFullDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `${DAYS_NAMES[d.getDay()]}, ${d.getDate().toString().padStart(2, '0')} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
        };

        window.formatDDMMYY = (dateStr) => {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if(parts.length !== 3) return dateStr;
            return `${parts[2]}-${parts[1]}-${parts[0].slice(-2)}`;
        };

        window.getSoftColorClass = (bgClass) => {
            if(!bgClass) return 'bg-gray-100 text-gray-700';
            const color = bgClass.replace('bg-', '');
            const base = color.split('-')[0];
            return `bg-${base}-100 text-${base}-700 border border-${base}-200`;
        };

        window.state = {
            currentUser: null,
            activeTab: 'Dashboard', 
            userName: 'Netalen', 
            theme: THEMES[0], 
            
            dashboardViewMode: 'all', 
            showMonthSummary: false,
            
            calendarViewMode: 'month', // 'month' or 'week'
            agendaStartDate: TODAY, // For 7-day schedule
            
            tasks: [], 
            projects: [],
            
            calMonth: dateObj.getMonth(), 
            calYear: dateObj.getFullYear(), 
            
            isTaskModalOpen: false, taskModalData: null,
            isProjectModalOpen: false, projectForm: null,
            
            telegramUsername: '',
            enableAutoReminder: false,
        };

        let unsubscribeSnapshot = null;

        // AUTHENTICATION LISTENER
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.state.currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                document.getElementById('loading-text').innerText = 'Syncing your data...';
                document.getElementById('loading-screen').style.display = 'flex';

                const docRef = doc(db, 'artifacts', 'tasktracker', 'users', user.uid);
                if (unsubscribeSnapshot) unsubscribeSnapshot();

                unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        window.state.userName = data.userName || user.displayName || 'User';
                        window.state.theme = THEMES.find(t=>t.id === data.themeId) || THEMES[0];
                        window.state.tasks = data.tasks || [];
                        window.state.projects = data.projects || [];
                        window.state.telegramUsername = data.telegramUsername || '';
                        window.state.enableAutoReminder = data.enableAutoReminder || false;
                        
                        // Default values for projects
                        window.state.projects.forEach((p, idx) => { 
                            if(typeof p.isCollapsed === 'undefined') p.isCollapsed = false; 
                            if(typeof p.order === 'undefined') p.order = idx;
                        });
                        window.state.projects.sort((a,b) => a.order - b.order);
                    } else {
                        window.state.userName = user.displayName || 'User';
                    }
                    
                    document.getElementById('loading-screen').style.display = 'none';
                    if(!document.getElementById('tab-content')) window.renderApp();
                    else window.refreshTab();
                }, (err) => {
                    console.error("Firebase Sync Error:", err);
                    document.getElementById('loading-screen').style.display = 'none';
                });

                window.saveToStorage = async function() {
                    if(!window.state.currentUser) return;
                    const dataToSave = {
                        userName: window.state.userName, themeId: window.state.theme.id,
                        tasks: window.state.tasks, projects: window.state.projects,
                        telegramUsername: window.state.telegramUsername, enableAutoReminder: window.state.enableAutoReminder
                    };
                    try { await setDoc(docRef, dataToSave); } catch(e) {}
                };
            } else {
                window.state.currentUser = null;
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('app').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app').innerHTML = '';
            }
        });

        window.loginWithGoogle = () => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('loading-text').innerText = 'Signing in...';
            document.getElementById('loading-screen').style.display = 'flex';
            signInWithPopup(auth, provider).catch(error => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
            });
        };

        window.logout = () => signOut(auth);

        // Core Render
        window.renderApp = function() {
            if(!window.state.currentUser) return;
            applyThemeBody();
            document.getElementById('app').innerHTML = `
                ${renderMobileHeader()}
                ${renderDesktopSidebar()}
                ${renderMainContent()}
                ${renderMobileNav()}
            `;
            lucide.createIcons();
        };

        window.refreshTab = function() {
            if(!window.state.currentUser) return;
            const content = document.getElementById('tab-content');
            const mainEl = document.getElementById('main-scroll-area');
            const scrollPos = mainEl ? mainEl.scrollTop : 0; // Save scroll position
            
            applyThemeBody();
            if (content) {
                if (window.state.activeTab === 'Dashboard') content.innerHTML = viewDashboard();
                else if (window.state.activeTab === 'Calendar') content.innerHTML = viewCalendar();
                else if (window.state.activeTab === 'Details') content.innerHTML = viewDetails();
                else if (window.state.activeTab === 'Settings') content.innerHTML = viewSettings();
                lucide.createIcons();
                
                // Restore scroll position smoothly
                requestAnimationFrame(() => {
                    const newMain = document.getElementById('main-scroll-area');
                    if(newMain) newMain.scrollTop = scrollPos;
                });
            }
        };

        window.renderModals = function() {
            const modalRoot = document.getElementById('modal-root');
            let html = '';
            if (window.state.isTaskModalOpen) html += renderUnifiedTaskModal();
            if (window.state.isProjectModalOpen) html += renderProjectSettingsModal();
            modalRoot.innerHTML = html;
            lucide.createIcons();
        };

        function applyThemeBody() {
            if (window.state.theme.isDark) {
                document.body.classList.remove('bg-slate-50', 'text-gray-800');
                document.body.classList.add('bg-gray-900', 'text-gray-100');
            } else {
                document.body.classList.remove('bg-gray-900', 'text-gray-100');
                document.body.classList.add('bg-slate-50', 'text-gray-800');
            }
        }

        function getCardClasses(isDark) {
            return isDark ? 'bg-gray-800 border-gray-700 text-gray-200' : 'bg-white border-gray-100 shadow-sm';
        }
        function getBgClasses(isDark) {
            return isDark ? 'bg-gray-800 text-gray-200' : 'bg-gray-50 text-gray-700';
        }
        function getTextClasses(isDark) {
            return isDark ? 'text-gray-300' : 'text-gray-500';
        }
        function getHeadingClasses(isDark) {
            return isDark ? 'text-white' : 'text-gray-800';
        }

        // Layout
        function renderMobileHeader() {
            return `
            <header class="lg:hidden ${window.state.theme.mainBg} text-white p-4 rounded-b-3xl flex justify-between items-center z-20 shadow-md flex-shrink-0">
                <div class="flex items-center gap-3">
                    <img src="${window.state.currentUser?.photoURL || 'https://via.placeholder.com/150'}" alt="Profile" class="w-10 h-10 rounded-full border-2 border-white/20 bg-black/20 object-cover">
                    <div>
                        <div class="flex items-center gap-1.5 h-5">
                            <img src="logo.png" alt="nytask!" class="h-4 object-contain" onerror="this.onerror=null; this.outerHTML='<span class=&quot;font-extrabold text-sm tracking-tight&quot;>nytask!</span>'">
                        </div>
                        <p class="text-[10px] mt-0.5 ${window.state.theme.accentText}">Hello, ${window.state.userName}</p>
                    </div>
                </div>
            </header>`;
        }

        function renderDesktopSidebar() {
            const isDark = window.state.theme.isDark;
            const navItems = TABS.map(t => `
                <button onclick="window.setActiveTab('${t.id}')" class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl transition-all duration-200 ${window.state.activeTab === t.id ? 'bg-white/10 font-medium shadow-sm text-white' : 'text-white/70 hover:bg-white/5 hover:text-white'}">
                    <i data-lucide="${t.icon}" class="w-5 h-5"></i> ${t.name}
                </button>
            `).join('');

            return `
            <aside class="hidden lg:flex w-64 ${window.state.theme.mainBg} text-white flex-shrink-0 flex-col rounded-r-3xl z-10 h-full transition-colors duration-300 border-r ${isDark ? 'border-gray-800' : 'border-transparent'}">
                <div class="p-8 pb-4">
                    <div class="flex items-center gap-3 mb-10 h-8">
                        <img src="logo.png" alt="nytask!" class="h-7 object-contain" onerror="this.onerror=null; this.outerHTML='<span class=&quot;font-extrabold text-2xl tracking-tight&quot;>nytask!</span>'">
                    </div>
                    <div class="flex flex-col items-center mb-6">
                        <img src="${window.state.currentUser?.photoURL || 'https://via.placeholder.com/150'}" alt="Profile" class="w-20 h-20 rounded-full border-4 border-white/20 bg-black/20 object-cover mb-4 shadow-lg">
                        <h2 class="font-semibold text-lg">${window.state.userName}</h2>
                    </div>
                </div>
                <nav class="flex-1 px-4 space-y-2">${navItems}</nav>
            </aside>`;
        }

        function renderMobileNav() {
            const isDark = window.state.theme.isDark;
            const navItems = TABS.map(t => `
                <button onclick="window.setActiveTab('${t.id}')" class="flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${window.state.activeTab === t.id ? window.state.theme.mainText : (isDark?'text-gray-500':'text-gray-400')}">
                    <i data-lucide="${t.icon}" class="w-5 h-5 ${window.state.activeTab === t.id ? 'fill-current opacity-20' : ''}"></i>
                    <span class="text-[9px] font-bold">${t.name}</span>
                </button>
            `).join('');
            return `<div class="lg:hidden fixed bottom-0 left-0 w-full ${isDark?'bg-gray-900 border-gray-800':'bg-white border-gray-200'} border-t z-40 flex justify-around items-center h-16 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">${navItems}</div>`;
        }

        function renderMainContent() {
            const isDark = window.state.theme.isDark;
            const title = window.state.activeTab === 'Dashboard' ? `Hello, ${window.state.userName}` : TABS.find(t=>t.id === window.state.activeTab).name;
            return `
            <main id="main-scroll-area" class="flex-1 p-4 lg:p-10 pb-28 lg:pb-10 overflow-y-auto scrollbar-hide flex flex-col relative">
                <!-- Desktop Header -->
                <header class="hidden lg:flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 flex-shrink-0">
                    <div>
                        <h1 class="text-3xl font-bold tracking-tight ${getHeadingClasses(isDark)}">${title}</h1>
                        <p class="${getTextClasses(isDark)} mt-1 font-medium">Today is ${window.formatFullDate(TODAY)}</p>
                    </div>
                </header>

                <!-- Mobile Header -->
                <div class="lg:hidden mb-4 space-y-2">
                    <div class="flex justify-between items-end">
                        <h1 class="text-2xl font-bold tracking-tight ${getHeadingClasses(isDark)}">${window.state.activeTab === 'Dashboard' ? 'Overview' : title}</h1>
                    </div>
                    <p class="text-xs font-bold ${getTextClasses(isDark)}">${window.formatFullDate(TODAY)}</p>
                </div>

                <div class="flex-1 max-w-6xl w-full mx-auto" id="tab-content">
                    ${window.state.activeTab === 'Dashboard' ? viewDashboard() : ''}
                    ${window.state.activeTab === 'Calendar' ? viewCalendar() : ''}
                    ${window.state.activeTab === 'Details' ? viewDetails() : ''}
                    ${window.state.activeTab === 'Settings' ? viewSettings() : ''}
                </div>

                <button onclick="window.openCreateTaskModal()" class="fixed bottom-20 right-4 lg:bottom-10 lg:right-10 w-14 h-14 lg:w-16 lg:h-16 ${window.state.theme.mainBg} text-white rounded-full flex items-center justify-center shadow-xl ${window.state.theme.hoverBg} hover:scale-105 transition-all z-30 group" title="Add New Task">
                    <i data-lucide="plus" class="w-6 h-6 lg:w-8 lg:h-8 group-hover:rotate-90 transition-transform duration-300"></i>
                </button>
            </main>`;
        }

        // ==========================================
        // COUNTDOWN LOGIC FOR HIGH PRIORITY
        // ==========================================
        function getUrgencyHTML(dateStr, isDone) {
            if(isDone) return `<span class="text-gray-400 font-bold ml-2 text-[10px]">(Done)</span>`;
            if(!dateStr) return '';
            
            const tDate = new Date(dateStr);
            const today = new Date(TODAY);
            tDate.setHours(0,0,0,0); today.setHours(0,0,0,0);
            
            const diffDays = Math.ceil((tDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return `<span class="text-red-600 font-bold ml-2 text-xs">Overdue</span>`;
            if (diffDays === 0) return `<span class="text-red-600 font-bold ml-2 text-xs">Today</span>`;
            if (diffDays <= 3) return `<span class="text-red-600 font-bold ml-2 text-xs">${diffDays} days left</span>`;
            return `<span class="text-gray-500 ml-2 text-xs">${diffDays} days left</span>`;
        }

        // ==========================================
        // TABS: DASHBOARD
        // ==========================================
        function viewDashboard() {
            const isDark = window.state.theme.isDark;
            const cardCls = getCardClasses(isDark);
            const textCls = getTextClasses(isDark);
            const headCls = getHeadingClasses(isDark);

            const todaysTasks = window.state.tasks.filter(t => t.date === TODAY);
            const todaysActions = window.state.projects.flatMap(p => p.actions.filter(a => a.date === TODAY));
            const allToday = [...todaysTasks, ...todaysActions];
            
            const todayDone = allToday.filter(i => i.status === 'Done').length;
            const todayNotDone = allToday.length - todayDone;
            const todayTotal = allToday.length;

            let monthComp = 0, monthToDo = 0;
            window.state.tasks.forEach(t => { const d = new Date(t.date); if (d.getMonth() === window.state.calMonth && d.getFullYear() === window.state.calYear) { t.status === 'Done' ? monthComp++ : monthToDo++; }});
            window.state.projects.forEach(p => { p.actions.forEach(a => { const d = new Date(a.date); if (d.getMonth() === window.state.calMonth && d.getFullYear() === window.state.calYear) { a.status === 'Done' ? monthComp++ : monthToDo++; }});});
            
            const monthActiveProjects = window.state.projects.filter(p => {
                const start = new Date(p.startDate), end = p.endDate ? new Date(p.endDate) : new Date(2099, 11, 31);
                const filterStart = new Date(window.state.calYear, window.state.calMonth, 1), filterEnd = new Date(window.state.calYear, window.state.calMonth + 1, 0);
                return start <= filterEnd && end >= filterStart;
            }).length;

            let years = []; for(let i=2026; i<=2030; i++) years.push(i);
            const monthOpts = MONTH_NAMES.map((m, idx) => `<option value="${idx}" ${idx === window.state.calMonth ? 'selected' : ''}>${m}</option>`).join('');
            const yearOpts = years.map(y => `<option value="${y}" ${y === window.state.calYear ? 'selected' : ''}>${y}</option>`).join('');

            let displayList = [];
            if (window.state.dashboardViewMode === 'all') {
                const aTasks = window.state.tasks;
                const aActions = window.state.projects.flatMap(p => p.actions.map(a => ({...a, isProjectAction: true, projectId: p.id, projectTitle: p.title})));
                displayList = [...aTasks, ...aActions];
            } else {
                const hpTasks = window.state.tasks.filter(t => t.priority === 'High' && t.status !== 'Done');
                const hpActions = window.state.projects.flatMap(p => p.actions.filter(a => a.priority === 'High' && a.status !== 'Done').map(a => ({...a, isProjectAction: true, projectId: p.id, projectTitle: p.title})));
                displayList = [...hpTasks, ...hpActions];
            }

            displayList.sort((a, b) => new Date(a.date) - new Date(b.date));

            const listHTML = displayList.length === 0 
                ? `<p class="text-sm ${textCls} italic p-4 text-center border border-dashed rounded-xl">No tasks found for this view.</p>`
                : displayList.map(item => {
                    const isDone = item.status === 'Done';
                    const proj = item.isProjectAction ? window.state.projects.find(p=>p.id === item.projectId) : window.state.projects.find(p=>p.title === item.category);
                    const catColorStr = proj ? proj.color : 'bg-gray-300';
                    const urgencyBadge = window.state.dashboardViewMode === 'high' ? getUrgencyHTML(item.date, isDone) : '';
                    
                    return `
                    <div class="p-3 lg:p-4 rounded-xl border flex flex-col gap-2 transition-all relative overflow-hidden ${cardCls}">
                        <div class="absolute left-0 top-0 bottom-0 w-1 ${isDone ? 'bg-gray-400 opacity-50' : catColorStr}"></div>
                        <div class="flex justify-between items-start w-full pl-2">
                            <h4 class="font-bold text-sm lg:text-base ${isDone ? 'line-through text-gray-400' : headCls}">${item.title || item.text} ${urgencyBadge}</h4>
                        </div>
                        <div class="pl-2 w-full flex justify-between items-end mt-1">
                             <div class="text-[10px] lg:text-xs ${textCls} font-medium">
                                ${item.isProjectAction ? `<span class="flex items-center gap-1"><i data-lucide="briefcase" class="w-3 h-3"></i> ${item.projectTitle}</span>` : ''}
                                ${!item.isProjectAction && item.category && item.category !== 'General' ? `<span class="flex items-center gap-1"><i data-lucide="tag" class="w-3 h-3"></i> ${item.category}</span>` : ''}
                                <span class="flex items-center gap-1 mt-0.5"><i data-lucide="calendar" class="w-3 h-3"></i> ${window.formatDDMMYY(item.date)} ${item.startTime ? `| ${item.startTime}` : ''}</span>
                             </div>
                             <span class="text-[10px] font-bold px-2 py-1 rounded ${isDone ? 'bg-green-100 text-green-700' : (item.status === 'In Progress' ? 'bg-blue-100 text-blue-700' : 'bg-gray-200 text-gray-700')}">${item.status}</span>
                        </div>
                    </div>`;
                }).join('');

            return `
            <div class="space-y-6 lg:space-y-8 pb-10">
                <!-- TODAY OVERVIEW -->
                <section>
                    <h2 class="text-xl lg:text-2xl font-bold mb-4 flex items-center gap-2 ${headCls}">Today's Overview</h2>
                    <div class="grid grid-cols-3 gap-3 lg:gap-6">
                        <div class="${cardCls} p-5 lg:p-6 rounded-2xl lg:rounded-3xl border flex flex-col justify-center items-center text-center border-b-4 border-b-orange-400">
                            <span class="text-3xl lg:text-5xl font-bold text-orange-500 mb-1">${todayNotDone}</span>
                            <span class="text-xs lg:text-sm font-bold ${textCls} uppercase tracking-wider">To Do</span>
                        </div>
                        <div class="${cardCls} p-5 lg:p-6 rounded-2xl lg:rounded-3xl border flex flex-col justify-center items-center text-center">
                            <span class="text-3xl lg:text-5xl font-bold ${window.state.theme.mainText} mb-1">${todayDone}</span>
                            <span class="text-xs lg:text-sm font-bold ${textCls} uppercase tracking-wider">Done</span>
                        </div>
                        <div class="${cardCls} p-5 lg:p-6 rounded-2xl lg:rounded-3xl border flex flex-col justify-center items-center text-center">
                            <span class="text-3xl lg:text-5xl font-bold ${headCls} mb-1">${todayTotal}</span>
                            <span class="text-xs lg:text-sm font-bold ${textCls} uppercase tracking-wider">Total</span>
                        </div>
                    </div>
                </section>

                <!-- MONTH OVERVIEW -->
                <section class="${cardCls} rounded-2xl lg:rounded-3xl border p-4 lg:p-6 transition-all">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex items-center gap-2 cursor-pointer select-none" onclick="window.toggleMonthSummary()">
                            <h2 class="text-base lg:text-lg font-bold ${headCls}">Month Overview</h2>
                            <i data-lucide="${window.state.showMonthSummary ? 'chevron-up' : 'chevron-down'}" class="w-5 h-5 ${textCls}"></i>
                        </div>
                        <div class="flex gap-2 ${window.state.showMonthSummary ? '' : 'hidden'}">
                            <select onchange="window.changeSummaryDate('month', this.value)" class="appearance-none ${isDark?'bg-gray-700 text-white border-gray-600':'bg-gray-50 border-gray-200 text-gray-700'} border py-1.5 px-3 rounded-lg focus:outline-none text-xs font-medium cursor-pointer">${monthOpts}</select>
                            <select onchange="window.changeSummaryDate('year', this.value)" class="appearance-none ${isDark?'bg-gray-700 text-white border-gray-600':'bg-gray-50 border-gray-200 text-gray-700'} border py-1.5 px-3 rounded-lg focus:outline-none text-xs font-medium cursor-pointer">${yearOpts}</select>
                        </div>
                    </div>
                    
                    <div class="grid-cols-3 gap-3 lg:gap-4 mt-4 ${window.state.showMonthSummary ? 'grid' : 'hidden'}">
                        <div class="${isDark?'bg-gray-700':'bg-gray-50'} p-3 lg:p-4 rounded-xl flex flex-col justify-center items-center">
                            <span class="text-xl lg:text-2xl font-bold ${headCls} mb-1">${monthToDo}</span>
                            <span class="text-[10px] lg:text-xs font-medium ${textCls}">Pending</span>
                        </div>
                        <div class="${isDark?'bg-gray-700':'bg-gray-50'} p-3 lg:p-4 rounded-xl flex flex-col justify-center items-center">
                            <span class="text-xl lg:text-2xl font-bold ${headCls} mb-1">${monthComp}</span>
                            <span class="text-[10px] lg:text-xs font-medium ${textCls}">Completed</span>
                        </div>
                        <div class="${isDark?'bg-gray-700':'bg-gray-50'} p-3 lg:p-4 rounded-xl flex flex-col justify-center items-center">
                            <span class="text-xl lg:text-2xl font-bold ${headCls} mb-1">${monthActiveProjects}</span>
                            <span class="text-[10px] lg:text-xs font-medium ${textCls}">Active Projects</span>
                        </div>
                    </div>
                </section>
                
                <!-- TASK LIST -->
                <section>
                    <div class="flex items-center gap-2 mb-4 border-b ${isDark?'border-gray-700':'border-gray-200'}">
                        <button onclick="window.setDashboardView('all')" class="px-4 py-2 text-sm font-bold transition-all border-b-2 ${window.state.dashboardViewMode === 'all' ? `${window.state.theme.mainBorder} ${window.state.theme.mainText}` : `border-transparent ${textCls} hover:${headCls}`}">All Tasks</button>
                        <button onclick="window.setDashboardView('high')" class="px-4 py-2 text-sm font-bold transition-all border-b-2 flex items-center gap-1 ${window.state.dashboardViewMode === 'high' ? `border-red-500 text-red-500` : `border-transparent ${textCls} hover:text-red-400`}"><i data-lucide="flame" class="w-4 h-4"></i> High Priority</button>

        // ==========================================
        // TABS: DETAILS (KANBAN)
        // ==========================================
        function viewDetails() {
            const isDark = window.state.theme.isDark;
            const cardCls = getCardClasses(isDark);
            const textCls = getTextClasses(isDark);
            const headCls = getHeadingClasses(isDark);

            const projectsHTML = window.state.projects.map(project => {
                const catColor = project.color || 'bg-gray-500';
                const KANBAN_COLS = ['To Do', 'In Progress', 'Done'];
                
                const boardHTML = KANBAN_COLS.map(status => {
                    const colActions = project.actions.filter(a => a.status === status);
                    colActions.sort((a,b) => {
                       const pA = PRIORITY_SCORES[a.priority || 'Medium'];
                       const pB = PRIORITY_SCORES[b.priority || 'Medium'];
                       if(pA !== pB) return pB - pA;
                       return new Date(a.date) - new Date(b.date);
                    });
                    
                    const cardsHTML = colActions.map(action => {
                        const isDone = status === 'Done';
                        
                        // Check if LATE
                        let lateBadge = '';
                        if (!isDone && action.date && action.date < TODAY) {
                            lateBadge = `<span class="text-red-500 font-bold text-[9px] border border-red-200 bg-red-50 px-1 rounded ml-2">LATE</span>`;
                        }

                        return `
                        <div draggable="true" ondragstart="window.dragStart(event, ${project.id}, ${action.id})" class="kanban-card ${isDark?'bg-gray-700 border-gray-600':'bg-white border-gray-200'} p-3 rounded-xl shadow-sm border transition relative mb-3 group cursor-pointer" onclick="window.openEditTaskModal(${project.id}, ${action.id}, true)">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] ${textCls} font-medium flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${window.formatDDMMYY(action.date)} ${lateBadge}</span>
                                
                                <!-- Inline Status Dropdown -->
                                <select onchange="window.updateItemStatus(${project.id}, ${action.id}, true, this.value)" onclick="event.stopPropagation()" class="text-[9px] font-bold px-1 py-0.5 rounded outline-none border focus:ring-1 cursor-pointer ${isDone ? 'bg-green-100 text-green-700 border-green-200' : (status==='In Progress' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-gray-100 text-gray-700 border-gray-200')}">
                                    <option value="To Do" ${status==='To Do'?'selected':''}>To Do</option>
                                    <option value="In Progress" ${status==='In Progress'?'selected':''}>In Progress</option>
                                    <option value="Done" ${status==='Done'?'selected':''}>Done</option>
                                </select>
                            </div>
                            <h5 class="text-sm font-bold leading-tight ${isDone ? 'line-through text-gray-500' : headCls}">${action.text}</h5>
                            ${action.details ? `<p class="text-xs ${textCls} mt-2 line-clamp-2">${action.details}</p>` : ''}
                        </div>`;
                    }).join('');
                    
                    const addTaskBtn = status === 'To Do' ? `<button onclick="window.openCreateTaskModal(${project.id})" class="mt-2 w-full py-2 ${isDark?'bg-gray-700 border-gray-600 text-gray-300 hover:text-white':'bg-white border-gray-300 text-gray-500 hover:text-gray-800'} border border-dashed rounded-xl text-xs font-bold transition flex items-center justify-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> Add Task</button>` : '';

                    return `
                    <div class="flex-1 min-w-[260px] ${isDark?'bg-gray-800':'bg-gray-50'} rounded-2xl p-3 border ${isDark?'border-gray-700':'border-gray-100'} flex flex-col" ondragover="window.allowDrop(event)" ondrop="window.dropCard(event, ${project.id}, '${status}')">
                        <div class="flex justify-between items-center mb-3 px-1">
                            <h4 class="font-bold ${headCls} text-sm flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full ${status === 'Done' ? 'bg-green-500' : (status === 'In Progress' ? 'bg-blue-500' : 'bg-gray-400')}"></div>
                                ${status}
                            </h4>
                            <span class="${isDark?'bg-gray-700 text-gray-300':'bg-gray-200 text-gray-600'} text-xs font-bold px-2 py-0.5 rounded-full">${colActions.length}</span>
                        </div>
                        <div class="flex-1 min-h-[100px]">
                            ${cardsHTML}
                            ${addTaskBtn}
                        </div>
                    </div>`;
                }).join('');

                const isCollapsed = project.isCollapsed;

                return `
                <div class="${cardCls} rounded-3xl p-4 lg:p-6 border relative overflow-hidden transition-all flex flex-col gap-4">
                    <div class="absolute top-0 left-0 w-full h-1.5 ${catColor}"></div>
                    
                    <div class="flex items-start gap-3 w-full mt-2">
                        <!-- Project Reorder Buttons -->
                        <div class="flex flex-col items-center justify-center ${textCls} bg-black/5 rounded p-0.5">
                            <button onclick="window.moveProject(-1, ${project.id})" class="hover:${headCls}"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                            <i data-lucide="grip-vertical" class="w-3 h-3 opacity-50 my-1"></i>
                            <button onclick="window.moveProject(1, ${project.id})" class="hover:${headCls}"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                        </div>
                        
                        <!-- Collapse Toggle -->
                        <button onclick="window.toggleProjectCollapse(${project.id})" class="mt-1 p-1 ${isDark?'bg-gray-700 hover:bg-gray-600':'bg-gray-100 hover:bg-gray-200'} rounded ${textCls} transition">
                            <i data-lucide="${isCollapsed ? 'chevron-right' : 'chevron-down'}" class="w-4 h-4"></i>
                        </button>
                        
                        <div class="flex-1 flex justify-between items-start">
                            <div>
                                <div class="flex items-center gap-2 lg:gap-3">
                                    <h3 class="text-xl lg:text-2xl font-bold ${headCls}">${project.title}</h3>
                                    <button onclick="window.openProjectSettings(${project.id})" class="p-1.5 ${textCls} hover:${window.state.theme.mainText} rounded-lg transition bg-black/5" title="Edit Project">
                                        <i data-lucide="pencil" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="text-right hidden sm:block">
                                <span class="text-xl font-bold ${window.state.theme.mainText}">${project.progress}%</span>
                                <p class="text-[10px] ${textCls}">Completed</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex gap-4 overflow-x-auto pb-2 snap-x ${isCollapsed ? 'hidden' : ''}">
                        ${boardHTML}
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
                    <h2 class="text-xl lg:text-2xl font-bold ${headCls}">Project Details</h2>
                    <button onclick="window.openCreateProjectModal()" class="${window.state.theme.mainBg} text-white px-4 py-2 rounded-xl text-sm font-semibold ${window.state.theme.hoverBg} transition flex items-center justify-center gap-2 shadow-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i> New Project
                    </button>
                </div>
                ${projectsHTML}
            </div>`;
        }

        // ==========================================
        // TABS: CALENDAR
        // ==========================================
        function viewCalendar() {
            const isDark = window.state.theme.isDark;
            const cardCls = getCardClasses(isDark);
            const textCls = getTextClasses(isDark);
            const headCls = getHeadingClasses(isDark);

            const vMode = window.state.calendarViewMode;

            // Header Buttons
            const toggleHTML = `
            <div class="flex bg-black/5 p-1 rounded-lg">
                <button onclick="window.setCalendarMode('month')" class="px-3 py-1.5 text-xs font-bold rounded-md transition ${vMode==='month' ? 'bg-white shadow text-gray-800' : textCls}">Month</button>
                <button onclick="window.setCalendarMode('week')" class="px-3 py-1.5 text-xs font-bold rounded-md transition ${vMode==='week' ? 'bg-white shadow text-gray-800' : textCls}">Week</button>
            </div>`;

            if (vMode === 'month') {
                return `
                <div class="flex flex-col gap-6 lg:gap-8 h-full pb-10">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl lg:text-2xl font-bold ${headCls}">Monthly Calendar</h2>
                        ${toggleHTML}
                    </div>
                    <!-- Calendar Grid -->
                    <div class="${cardCls} p-4 lg:p-6 rounded-2xl lg:rounded-3xl border overflow-x-auto">
                        <div class="flex justify-between items-center mb-4 lg:mb-6 min-w-[300px]">
                            <h3 class="text-lg lg:text-xl font-bold ${headCls}">${MONTH_NAMES[window.state.calMonth]} ${window.state.calYear}</h3>
                            <div class="flex gap-2">
                                <button onclick="window.changeMonth(-1)" class="p-1.5 lg:p-2 border ${isDark?'border-gray-600 hover:bg-gray-700':'border-gray-200 hover:bg-gray-50'} rounded-lg disabled:opacity-50"><i data-lucide="chevron-left" class="w-4 h-4 lg:w-5 lg:h-5 ${textCls}"></i></button>
                                <button onclick="window.changeMonth(1)" class="p-1.5 lg:p-2 border ${isDark?'border-gray-600 hover:bg-gray-700':'border-gray-200 hover:bg-gray-50'} rounded-lg disabled:opacity-50"><i data-lucide="chevron-right" class="w-4 h-4 lg:w-5 lg:h-5 ${textCls}"></i></button>
                            </div>
                        </div>
                        <div class="grid grid-cols-7 gap-1 lg:gap-2 mb-1 lg:mb-2 min-w-[300px]">
                            ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="text-center text-[10px] lg:text-sm font-semibold ${textCls} py-1 lg:py-2">${window.innerWidth < 640 ? d.charAt(0) : d}</div>`).join('')}
                        </div>
                        <div class="grid grid-cols-7 gap-1 lg:gap-2 min-w-[300px]">
                            ${renderMonthlyGrid(isDark, textCls, headCls)}
                        </div>
                    </div>
                    
                    <!-- 7 Days Agenda -->
                    <div class="${cardCls} p-4 lg:p-6 rounded-2xl lg:rounded-3xl border flex-1">
                        <div class="flex justify-between items-center mb-4 lg:mb-6 border-b pb-4 ${isDark?'border-gray-700':'border-gray-100'}">
                            <h2 class="text-lg lg:text-xl font-bold flex items-center gap-2 ${headCls}">
                                <i data-lucide="calendar-days" class="w-5 h-5 lg:w-6 lg:h-6 ${window.state.theme.mainText}"></i>
                                Schedule (7 Days)
                            </h2>
                            <div class="flex gap-2">
                                <button onclick="window.shiftAgenda(-7)" class="p-1.5 border rounded-lg ${textCls} hover:bg-black/5" title="Previous 7 Days"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
                                <button onclick="window.shiftAgenda(7)" class="p-1.5 border rounded-lg ${textCls} hover:bg-black/5" title="Next 7 Days"><i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                        <div class="space-y-6">
                            ${render7DaysAgenda(isDark, textCls, headCls)}
                        </div>
                    </div>
                </div>`;
            } else {
                return `
                <div class="flex flex-col gap-6 h-full pb-10">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl lg:text-2xl font-bold ${headCls}">Weekly Planner</h2>
                        ${toggleHTML}
                    </div>
                    <div class="${cardCls} rounded-2xl lg:rounded-3xl border overflow-hidden flex flex-col h-[700px]">
                        ${renderWeeklyGrid(isDark, textCls, headCls)}
                    </div>
                </div>`;
            }
        }

        // MONTHLY GRID HELPER
        function renderMonthlyGrid(isDark, textCls, headCls) {
            const daysInMonth = new Date(window.state.calYear, window.state.calMonth + 1, 0).getDate();
            const startDay = new Date(window.state.calYear, window.state.calMonth, 1).getDay();
            
            let html = '';
            for(let i = 0; i < startDay; i++) html += `<div class="min-h-[70px] lg:min-h-[110px] rounded-lg lg:rounded-xl bg-black/5 p-1 lg:p-2 border border-transparent"></div>`;
            
            for(let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${window.state.calYear}-${String(window.state.calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = window.state.selectedDate === dateStr;
                const isToday = dateStr === TODAY;
                
                const dayTasks = window.state.tasks.filter(t => t.date === dateStr);
                const activeProjects = window.state.projects.filter(p => dateStr >= p.startDate && (!p.endDate || dateStr <= p.endDate));

                // Soft Pills for Projects
                let projBlocks = activeProjects.map(p => {
                    const softColor = window.getSoftColorClass(p.color);
                    return `<div class="${softColor} bg-opacity-30 text-[7px] sm:text-[9px] px-1 py-0.5 sm:truncate font-bold rounded mb-[2px] leading-none"><span class="hidden sm:inline">${p.title}</span></div>`;
                }).join('');

                // Soft Pills for Tasks
                let taskBlocks = dayTasks.map(t => {
                    const proj = window.state.projects.find(p=>p.title === t.category);
                    const softColor = window.getSoftColorClass(proj ? proj.color : 'bg-gray-500');
                    const strike = t.status === 'Done' ? 'line-through opacity-50' : '';
                    return `<div class="${softColor} bg-opacity-40 text-[7px] sm:text-[9px] px-1 py-0.5 sm:truncate font-bold rounded mb-[2px] leading-none ${strike}"><span class="hidden sm:inline">${t.title}</span></div>`;
                }).join('');

                html += `
                <div onclick="window.selectDate('${dateStr}')" class="min-h-[70px] lg:min-h-[110px] border rounded-lg lg:rounded-xl relative transition cursor-pointer flex flex-col overflow-hidden ${isSelected ? `${window.state.theme.mainBorder} shadow-md ${isDark?'bg-gray-800':'bg-white'}` : `${isDark?'border-gray-700 bg-gray-800 hover:border-gray-500':'border-gray-200 bg-white hover:border-gray-300'}`}">
                    <div class="px-1 lg:px-2 pt-1 lg:pt-2 flex justify-between items-center mb-1">
                        <span class="text-[10px] lg:text-sm font-bold w-5 h-5 lg:w-6 lg:h-6 flex items-center justify-center rounded-full ${isToday ? 'bg-orange-500 text-white' : (isSelected ? `${window.state.theme.mainBg} text-white` : textCls)}">${day}</span>
                    </div>
                    <div class="px-1 w-full flex flex-col overflow-hidden">
                        ${projBlocks}
                        ${taskBlocks}
                    </div>
                </div>`;
            }
            return html;
        }

        // 7 DAYS AGENDA HELPER
        function render7DaysAgenda(isDark, textCls, headCls) {
            let html = '';
            const dStart = new Date(window.state.agendaStartDate);
            
            for(let i=0; i<7; i++) {
                const currentD = new Date(dStart);
                currentD.setDate(dStart.getDate() + i);
                const dateStr = currentD.getFullYear() + '-' + String(currentD.getMonth()+1).padStart(2, '0') + '-' + String(currentD.getDate()).padStart(2, '0');
                
                const aTasks = window.state.tasks.filter(t => t.date === dateStr);
                const aActions = window.state.projects.flatMap(p => p.actions.filter(a => a.date === dateStr).map(a => ({...a, isProjectAction: true, projectId: p.id, projectTitle: p.title})));
                const combined = [...aTasks, ...aActions].sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));
                
                if (combined.length === 0) continue;

                const dayHTML = combined.map(item => {
                    const isDone = item.status === 'Done';
                    const proj = item.isProjectAction ? window.state.projects.find(p=>p.id === item.projectId) : window.state.projects.find(p=>p.title === item.category);
                    const catColorStr = proj ? proj.color : 'bg-gray-300';
                    
                    return `
                    <div class="p-2 lg:p-3 rounded-xl border flex items-center gap-2 lg:gap-3 transition-all relative overflow-hidden ${isDone ? 'bg-black/5 opacity-60 border-transparent' : (isDark?'bg-gray-800 border-gray-700':'bg-white shadow-sm border-gray-100')}">
                        <div class="absolute left-0 top-0 bottom-0 w-1 ${catColorStr}"></div>
                        <div class="w-12 lg:w-16 flex-shrink-0 text-center border-r ${isDark?'border-gray-700':'border-gray-100'}">
                            <span class="text-[10px] lg:text-xs font-bold ${window.state.theme.mainText} block">${item.startTime || 'All Day'}</span>
                        </div>
                        <div class="flex-1 overflow-hidden cursor-pointer pl-1" onclick="window.openEditTaskModal(${item.isProjectAction ? item.projectId : null}, ${item.id}, ${item.isProjectAction})">
                            <h4 class="font-bold text-sm truncate ${isDone ? 'line-through text-gray-500' : headCls}">${item.title || item.text}</h4>

        // WEEKLY GRID HELPER
        function renderWeeklyGrid(isDark, textCls, headCls) {
            // Get Start of Week (Sunday) based on Selected Date
            const sDate = new Date(window.state.selectedDate);
            const dayOfWeek = sDate.getDay();
            const startOfWeek = new Date(sDate);
            startOfWeek.setDate(sDate.getDate() - dayOfWeek);

            let headerHTML = `<div class="col-span-1 border-r ${isDark?'border-gray-700':'border-gray-200'} text-center py-2 text-[10px] font-bold ${textCls} bg-black/5">GMT+8</div>`;
            let allDayHTML = `<div class="col-span-1 border-r ${isDark?'border-gray-700':'border-gray-200'} text-[10px] font-bold ${textCls} p-2 flex items-center justify-center bg-black/5">All Day</div>`;
            let gridBgCols = '';
            
            const weekTasks = [];

            for(let i=0; i<7; i++) {
                const curD = new Date(startOfWeek); curD.setDate(startOfWeek.getDate() + i);
                const dStr = curD.getFullYear() + '-' + String(curD.getMonth()+1).padStart(2, '0') + '-' + String(curD.getDate()).padStart(2, '0');
                const isTdy = dStr === TODAY;
                
                headerHTML += `<div class="col-span-1 text-center py-2 border-r ${isDark?'border-gray-700':'border-gray-200'} flex flex-col items-center justify-center ${isTdy?'bg-orange-50':''}">
                    <span class="text-[9px] uppercase font-bold ${isTdy?'text-orange-500':textCls}">${DAYS_NAMES[i].slice(0,3)}</span>
                    <span class="text-lg font-bold ${isTdy?'text-orange-600':headCls} leading-none">${curD.getDate()}</span>
                </div>`;
                
                // Get All day tasks for this day
                const aTasks = window.state.tasks.filter(t => t.date === dStr);
                const aActions = window.state.projects.flatMap(p => p.actions.filter(a => a.date === dStr).map(a => ({...a, isProjectAction: true, projectId: p.id, projectTitle: p.title})));
                const combined = [...aTasks, ...aActions];
                
                let adContent = '';
                combined.forEach(t => {
                    if(t.isAllDay || !t.startTime) {
                        const proj = t.isProjectAction ? window.state.projects.find(p=>p.id === t.projectId) : window.state.projects.find(p=>p.title === t.category);
                        const softClass = window.getSoftColorClass(proj ? proj.color : 'bg-gray-500');
                        adContent += `<div class="${softClass} bg-opacity-80 text-[8px] font-bold p-0.5 mb-0.5 rounded truncate shadow-sm cursor-pointer" onclick="window.openEditTaskModal(${t.isProjectAction ? t.projectId : null}, ${t.id}, ${t.isProjectAction})">${t.title||t.text}</div>`;
                    } else {
                        // timed tasks
                        t.colIndex = i + 1; // 1 to 7
                        weekTasks.push(t);
                    }
                });
                
                allDayHTML += `<div class="col-span-1 border-r ${isDark?'border-gray-700':'border-gray-200'} p-1 min-h-[40px]">${adContent}</div>`;
                gridBgCols += `<div class="col-span-1 border-r ${isDark?'border-gray-700':'border-gray-200'} h-full"></div>`;
            }

            // Timed Tasks Elements
            let timedHTML = '';
            weekTasks.forEach(t => {
                const [h, m] = t.startTime.split(':').map(Number);
                const startMins = h * 60 + m;
                let durMins = 60; // default 1 hour
                if(t.endTime) {
                    const [eh, em] = t.endTime.split(':').map(Number);
                    durMins = (eh*60+em) - startMins;
                    if(durMins < 15) durMins = 15; // min height
                }
                const topPx = startMins; // 1 min = 1 px
                const heightPx = durMins;
                const leftPct = (t.colIndex / 8) * 100;
                const widthPct = 100 / 8;

                const proj = t.isProjectAction ? window.state.projects.find(p=>p.id === t.projectId) : window.state.projects.find(p=>p.title === t.category);
                const softClass = window.getSoftColorClass(proj ? proj.color : 'bg-gray-500');

                timedHTML += `
                <div class="absolute rounded-lg p-1.5 shadow-sm border overflow-hidden cursor-pointer hover:shadow-md transition-shadow ${softClass} bg-opacity-90" 
                     style="top: ${topPx}px; left: ${leftPct}%; width: calc(${widthPct}% - 4px); height: ${heightPx}px; margin-left: 2px; z-index: 10;"
                     onclick="window.openEditTaskModal(${t.isProjectAction ? t.projectId : null}, ${t.id}, ${t.isProjectAction})">
                    <div class="text-[8px] sm:text-[9px] font-bold leading-tight truncate">${t.title||t.text}</div>
                    <div class="text-[7px] sm:text-[8px] opacity-80 truncate mt-0.5">${t.startTime}${t.endTime?'-'+t.endTime:''}</div>
                </div>`;
            });

            // Grid time labels 1AM to 23PM
            let timeLabels = '';
            for(let h=1; h<24; h++) {
                const topPx = h * 60;
                timeLabels += `<div class="absolute left-0 w-full flex items-start" style="top: ${topPx}px; height: 60px;">
                    <div class="w-[12.5%] text-right pr-2 -mt-2 text-[9px] font-bold ${textCls}">${h}:00</div>
                </div>`;
            }

            return `
            <div class="flex items-center justify-between p-2 border-b ${isDark?'border-gray-700 bg-gray-800':'border-gray-200 bg-white'}">
                <div class="flex gap-2">
                    <button onclick="window.selectDate('${new Date(sDate.setDate(sDate.getDate()-7)).toISOString().split('T')[0]}')" class="p-1 border rounded ${textCls}"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <button onclick="window.selectDate('${new Date(sDate.setDate(sDate.getDate()+14)).toISOString().split('T')[0]}')" class="p-1 border rounded ${textCls}"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
                <span class="text-xs font-bold uppercase tracking-widest ${headCls}">${window.formatDDMMYY(startOfWeek.toISOString().split('T')[0])} - ${window.formatDDMMYY(new Date(startOfWeek.setDate(startOfWeek.getDate()+6)).toISOString().split('T')[0])}</span>
            </div>
            <div class="grid grid-cols-8 border-b ${isDark?'border-gray-700':'border-gray-200'} bg-white ${isDark?'bg-gray-800':''} flex-shrink-0">
                ${headerHTML}
            </div>
            <div class="grid grid-cols-8 border-b ${isDark?'border-gray-700':'border-gray-200'} bg-white ${isDark?'bg-gray-800':''} flex-shrink-0">
                ${allDayHTML}
            </div>
            <div class="flex-1 overflow-y-auto relative bg-white ${isDark?'bg-gray-900':''}">
                <div class="absolute inset-0 time-grid-bg ${isDark?'opacity-10':'opacity-30'}"></div>
                <div class="absolute inset-0 grid grid-cols-8 z-0">
                    <div class="col-span-1 border-r ${isDark?'border-gray-700':'border-gray-200'}"></div>
                    ${gridBgCols}
                </div>
                <div class="absolute inset-0 z-0">
                    ${timeLabels}
                </div>
                <!-- 1440px total height -->
                <div class="absolute top-0 left-0 w-full h-[1440px] pointer-events-none"></div>
                ${timedHTML}
            </div>`;
        }

        window.changeSummaryDate = (type, val) => { if(type === 'month') window.state.calMonth = parseInt(val); else window.state.calYear = parseInt(val); window.refreshTab(); };
        window.toggleMonthSummary = () => { window.state.showMonthSummary = !window.state.showMonthSummary; window.refreshTab(); };
        window.setDashboardView = (mode) => { window.state.dashboardViewMode = mode; window.refreshTab(); };

        // Calendar
        window.setCalendarMode = (mode) => { window.state.calendarViewMode = mode; window.refreshTab(); };
        window.changeMonth = (offset) => {
            let newM = window.state.calMonth + offset; let newY = window.state.calYear;
            if (newM > 11) { newM = 0; newY++; } else if (newM < 0) { newM = 11; newY--; }
            if (newY < 2026 || newY > 2030) return;
            window.state.calMonth = newM; window.state.calYear = newY; window.refreshTab();
        };
        window.selectDate = (dateStr) => { window.state.selectedDate = dateStr; window.refreshTab(); };
        window.shiftAgenda = (days) => {
            const d = new Date(window.state.agendaStartDate); d.setDate(d.getDate() + days);
            window.state.agendaStartDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            window.refreshTab();
        };

        // Project Move
        window.moveProject = (dir, id) => {
            const idx = window.state.projects.findIndex(p => p.id === id);
            if(idx < 0) return;
            if(dir === -1 && idx > 0) {
                let tmp = window.state.projects[idx].order;
                window.state.projects[idx].order = window.state.projects[idx-1].order;
                window.state.projects[idx-1].order = tmp;
            } else if (dir === 1 && idx < window.state.projects.length - 1) {
                let tmp = window.state.projects[idx].order;
                window.state.projects[idx].order = window.state.projects[idx+1].order;
                window.state.projects[idx+1].order = tmp;
            }
            window.state.projects.sort((a,b) => a.order - b.order);
            window.state.projects.forEach((p, i) => p.order = i); // normalize
            window.saveToStorage(); window.refreshTab();
        };
        window.toggleProjectCollapse = (id) => { window.state.projects = window.state.projects.map(p => p.id === id ? {...p, isCollapsed: !p.isCollapsed} : p); window.saveToStorage(); window.refreshTab(); };

        // Status Update inline
        window.updateItemStatus = (projectId, taskId, isAction, newStatus) => {
            if (isAction) {
                window.state.projects = window.state.projects.map(p => {
                    if (p.id === projectId) {
                        p.actions = p.actions.map(a => a.id === taskId ? { ...a, status: newStatus, isCompleted: newStatus === 'Done' } : a);
                        const comp = p.actions.filter(a => a.status === 'Done').length; p.progress = p.actions.length === 0 ? 0 : Math.round((comp / p.actions.length) * 100);
                    } return p;
                });
            } else {
                window.state.tasks = window.state.tasks.map(t => t.id === taskId ? { ...t, status: newStatus, done: newStatus === 'Done' } : t);
            }
            window.saveToStorage(); window.refreshTab();
        };

        // Drag Drop
        window.dragStart = (e, pId, aId) => { e.dataTransfer.setData('text/plain', JSON.stringify({ pId, aId })); };
        window.allowDrop = (e) => { e.preventDefault(); };
        window.dropCard = (e, targetPId, newStatus) => {
            e.preventDefault(); const dataStr = e.dataTransfer.getData('text/plain'); if(!dataStr) return; const data = JSON.parse(dataStr);
            if(data.pId === targetPId) {
                window.updateItemStatus(targetPId, data.aId, true, newStatus);
            }
        };

        // Task Modal
        window.openCreateTaskModal = (prefillProjectId = '') => { 
            window.state.taskModalData = { id: null, title: '', projectId: prefillProjectId, status: 'To Do', priority: 'Medium', date: '', startTime: '', endTime: '', details: '', category: '', isEdit: false }; 
            window.state.isTaskModalOpen = true; window.renderModals(); 
        };
        window.openEditTaskModal = (projectId, taskId, isAction) => {
            if (isAction) {
                const proj = window.state.projects.find(p => p.id === projectId); const act = proj.actions.find(a => a.id === taskId);
                window.state.taskModalData = { id: act.id, title: act.text, projectId: proj.id, status: act.status, priority: act.priority, date: act.date||'', startTime: act.startTime||'', endTime: act.endTime||'', details: act.details || '', category: proj.title, isEdit: true };
            } else {
                const t = window.state.tasks.find(t => t.id === taskId);
                window.state.taskModalData = { ...t, projectId: '', isEdit: true };
            }
            window.state.isTaskModalOpen = true; window.renderModals();
        };
        window.closeTaskModal = () => { window.state.isTaskModalOpen = false; window.renderModals(); };
        
        window.saveUnifiedTask = () => {
            const d = window.state.taskModalData; const title = document.getElementById('utm-title').value; if (!title) return;
            const projId = document.getElementById('utm-project').value, status = document.getElementById('utm-status').value, date = document.getElementById('utm-date').value, details = document.getElementById('utm-details').value;
            const startTime = document.getElementById('utm-start').value, endTime = document.getElementById('utm-end').value;
            const isDone = status === 'Done';
            const projObj = projId ? window.state.projects.find(p => p.id === parseInt(projId)) : null;
            const categoryName = projObj ? projObj.title : 'General';
            const priority = 'Medium'; // Hidden priority logic defaulting to medium

            if (d.isEdit) {
                if (d.projectId) {
                    window.state.projects = window.state.projects.map(p => {
                        if (p.id === d.projectId) {
                            p.actions = p.actions.map(a => a.id === d.id ? { ...a, text: title, date, startTime, endTime, status, details, isCompleted: isDone } : a);
                            const comp = p.actions.filter(a => a.status === 'Done').length; p.progress = Math.round((comp / p.actions.length) * 100);
                        } return p;
                    });
                } else window.state.tasks = window.state.tasks.map(t => t.id === d.id ? { ...t, title, date, startTime, endTime, priority, status, details, category: categoryName, done: isDone } : t);
            } else {
                if (projId) {
                    window.state.projects = window.state.projects.map(p => {
                        if (p.id === parseInt(projId)) {
                            p.actions.push({ id: Date.now(), text: title, date, startTime, endTime, priority, status, details, isCompleted: isDone });
                            const comp = p.actions.filter(a => a.status === 'Done').length; p.progress = Math.round((comp / p.actions.length) * 100);
                        } return p;
                    });
                } else window.state.tasks.push({ id: Date.now(), title, date, startTime, endTime, priority, status, details, category: categoryName, done: isDone, isAllDay: !startTime });
            }
            window.state.isTaskModalOpen = false; window.saveToStorage(); window.refreshTab(); // Refresh tab handles modal auto-close and scroll
        };

        window.deleteUnifiedTask = () => {
            const d = window.state.taskModalData;
            if (d.projectId) {
                window.state.projects = window.state.projects.map(p => {
                    if (p.id === d.projectId) {
                        p.actions = p.actions.filter(a => a.id !== d.id);
                        const comp = p.actions.filter(a => a.status === 'Done').length; p.progress = p.actions.length === 0 ? 0 : Math.round((comp / p.actions.length) * 100);
                    } return p;
                });
            } else window.state.tasks = window.state.tasks.filter(t => t.id !== d.id);
            window.state.isTaskModalOpen = false; window.saveToStorage(); window.refreshTab();
        };

        // Project Modal
        window.openCreateProjectModal = () => { window.state.projectForm = { id: null, title: '', startDate: TODAY, endDate: '', color: TAILWIND_COLORS[0] }; window.state.isEditingProject = false; window.state.isProjectModalOpen = true; window.renderModals(); };
        window.openProjectSettings = (id) => { const proj = window.state.projects.find(p => p.id === id); window.state.projectForm = { id: proj.id, title: proj.title, startDate: proj.startDate, endDate: proj.endDate, color: proj.color || TAILWIND_COLORS[0] }; window.state.isEditingProject = true; window.state.isProjectModalOpen = true; window.renderModals(); };
        window.closeProjectModal = () => { window.state.isProjectModalOpen = false; window.state.isEditingProject = false; window.renderModals(); };
        window.setProjectColorDOM = (color) => {
            window.state.projectForm.color = color;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-offset-2', 'ring-gray-400'));
            document.querySelector(`.color-btn[data-color="${color}"]`).classList.add('ring-2', 'ring-offset-2', 'ring-gray-400');
        };
        window.saveProject = () => {
            const title = document.getElementById('pf-title').value; if (!title) return;
            const startDate = document.getElementById('pf-start').value, endDate = document.getElementById('pf-end').value, color = window.state.projectForm.color;
            if (window.state.isEditingProject) window.state.projects = window.state.projects.map(p => p.id === window.state.projectForm.id ? { ...p, title, startDate, endDate, color } : p);
            else window.state.projects.push({ id: Date.now(), title, startDate, endDate, color, order: window.state.projects.length, isCollapsed: false, progress: 0, actions: [] });
            window.state.isProjectModalOpen = false; window.state.isEditingProject = false; window.saveToStorage(); window.refreshTab();
        };
        window.deleteProject = () => { window.state.projects = window.state.projects.filter(p => p.id !== window.state.projectForm.id); window.state.isProjectModalOpen = false; window.saveToStorage(); window.refreshTab(); };

        // Telegram Integration
        const BOT_TOKEN = "8620644076:AAFMscJ0jQN5PKiGHMA6gGi7cqDC4WRO7W8";
        window.saveTelegramSettings = () => {
            window.state.telegramUsername = document.getElementById('settings-telegram').value.replace('@','').trim();
            window.state.enableAutoReminder = document.getElementById('settings-auto').checked;
            window.saveToStorage(); alert("Preferences Saved!");
        };
        window.testTelegramMsg = async () => {
            const uname = document.getElementById('settings-telegram').value.replace('@','').trim();
            if(!uname) return alert("Please enter your Telegram username first.");
            alert("Memeriksa riwayat chat bot... Pastikan Anda sudah chat 'Halo' ke bot Anda!");
            
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                const data = await res.json();
                const chatObj = data.result.reverse().find(u => u.message && u.message.from && u.message.from.username && u.message.from.username.toLowerCase() === uname.toLowerCase());
                if(!chatObj) return alert(`Gagal: Bot tidak menemukan chat dari @${uname}. Chat bot Anda sekarang dan coba lagi.`);
                
                const chatId = chatObj.message.chat.id;
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: "✅ Test connection successful!\nYour nytask! tracker is now connected.", parse_mode: 'HTML' })
                });
                alert("Berhasil terkirim! Cek Telegram Anda.");
            } catch(e) { alert("Error connecting to Telegram: " + e.message); }
        };

    </script>
</body>
</html>
